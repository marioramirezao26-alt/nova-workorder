<!doctype html>
<!--
  Portada del video (landing/video/portada.webp, 1280×720).
  Misma composición de la portada anterior; el sello dice «7 DÍAS GRATIS».
  Para renderizar: NODE_PATH=$(npm root -g) node render.js portada
-->
<html lang="es-CO">
<head>
<meta charset="utf-8" />
<title>NOVAWORKORDER · portada del video</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #040c15; }
  body { font-family: 'Inter', 'Noto Color Emoji', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .emoji { font-family: 'Noto Color Emoji'; font-weight: 400; }
  #fondo { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 760px 620px at 42% 30%, rgba(30,68,126,1) 0%, rgba(22,52,98,.9) 28%, rgba(13,33,62,.7) 55%, rgba(7,17,33,0) 100%),
      linear-gradient(180deg, #050e1a 0%, #040c15 55%, #020810 100%); }

  .marca { position: absolute; left: 60px; top: 70px; display: flex; align-items: center; gap: 16px; }
  .marca .nombre { font-weight: 900; font-size: 41px; line-height: 40px; letter-spacing: 0.01em; }
  .marca .sub { font-weight: 500; font-size: 18px; letter-spacing: 0.34em; color: #d3e6fa; margin-top: 7px; }

  h1 { position: absolute; left: 58px; top: 170px; font-weight: 900; font-size: 92px; line-height: 92px; letter-spacing: -0.02em; }
  h1 .amarillo { color: #fbd54f; }

  .chips { position: absolute; left: 60px; top: 393px; display: flex; gap: 15px; }
  .chip { height: 66px; border-radius: 33px; display: flex; align-items: center; gap: 10px; padding: 0 26px 0 24px;
    background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.2);
    font-weight: 800; font-size: 29px; letter-spacing: -0.01em; white-space: nowrap; }
  .chip .emoji { font-size: 27px; }

  .sello { position: absolute; left: 62px; top: 606px; padding: 14px 30px; border-radius: 16px; background: #3ddc9f; color: #04140c;
    font-weight: 900; font-size: 41px; letter-spacing: 0.005em; white-space: nowrap; transform: rotate(-4deg); transform-origin: 0 100%;
    box-shadow: 0 14px 36px -10px rgba(61,220,159,.55); }

  .celular { position: absolute; width: 268px; height: 505px; border-radius: 42px; background: #12161d; border: 2px solid rgba(120,140,170,.6);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 30px 80px -20px rgba(0,0,0,.6), 0 0 60px rgba(40,100,220,.18); transform-origin: 50% 50%; }
  .celular .pantalla { position: absolute; left: 12px; top: 12px; width: 241px; height: 478px; border-radius: 31px; overflow: hidden; }
  .celular .pantalla img { display: block; width: 241px; height: 522px; }
  #cel-servicios { left: 788px; top: 60px; transform: rotate(-5deg) scale(1.0); }
  #cel-pedidos { left: 980px; top: 110px; transform: rotate(6deg) scale(1.0); }
</style>
</head>
<body>
  <div id="fondo"></div>
  <div class="marca">
    <svg width="70" height="70" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f5fd6"/><stop offset="1" stop-color="#5ea2ff"/></linearGradient></defs><rect width="100" height="100" rx="24" fill="url(#g)"/><path d="M28 72 V30 L55 66 L76 26" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><div class="nombre">NOVA</div><div class="sub">WORKORDER</div></div>
  </div>
  <h1>Tu negocio en<br>el <span class="amarillo">celular</span></h1>
  <div class="chips">
    <div class="chip"><span class="emoji">🛠️</span>Servicios</div>
    <div class="chip"><span class="emoji">🛍️</span>Pedidos</div>
  </div>
  <div class="sello">7 DÍAS GRATIS</div>
  <div class="celular" id="cel-servicios"><div class="pantalla"><img src="capturas/servicios-a.webp" alt=""></div></div>
  <div class="celular" id="cel-pedidos"><div class="pantalla" style="background:#f4f6fa"><img src="capturas/pedidos-tienda.webp" alt=""></div></div>
  <script>
    window.listo = Promise.all([document.fonts.ready].concat([].map.call(document.images, function (im) {
      return im.complete ? 0 : new Promise(function (r) { im.onload = im.onerror = r; });
    })));
  </script>
</body>
</html>
