  <rect y="500" width="1600" height="120" fill="url(#niebla)"/>
  <!-- cordillera cercana -->
  <path d="M0 640 L140 560 L240 610 L360 540 L470 610 L600 570 L720 640 L840 590 L960 650 L1090 580 L1210 640 L1330 570 L1450 630 L1600 580 L1600 760 L0 760 Z" fill="url(#cerca)"/>
