<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMax slice">
  <!-- Fondo propio del prototipo NOVA: cordilleras dibujadas a mano en SVG (no es una foto ni un recorte del mockup). -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050d"/><stop offset=".55" stop-color="#0a1433"/><stop offset="1" stop-color="#0d1a45"/>
    </linearGradient>
    <radialGradient id="luz" cx="62%" cy="42%" r="45%">
      <stop offset="0" stop-color="#3b6cff" stop-opacity=".5"/><stop offset=".5" stop-color="#4f46e5" stop-opacity=".16"/><stop offset="1" stop-color="#03050d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luz2" cx="12%" cy="30%" r="35%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lejos" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3f7e"/><stop offset="1" stop-color="#111c45"/></linearGradient>
    <linearGradient id="medio" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2a5e"/><stop offset="1" stop-color="#0a1230"/></linearGradient>
    <linearGradient id="cerca" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1a40"/><stop offset="1" stop-color="#05070f"/></linearGradient>
    <linearGradient id="niebla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d9bff" stop-opacity="0"/><stop offset=".5" stop-color="#6d9bff" stop-opacity=".14"/><stop offset="1" stop-color="#6d9bff" stop-opacity="0"/></linearGradient>
    <linearGradient id="nieve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb8ff" stop-opacity=".55"/><stop offset="1" stop-color="#9fb8ff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1600" height="760" fill="url(#cielo)"/>
  <rect width="1600" height="760" fill="url(#luz)"/>
  <rect width="1600" height="760" fill="url(#luz2)"/>
  <g fill="#cfe0ff">
