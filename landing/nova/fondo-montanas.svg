  <path d="M0 470 L90 400 L170 430 L260 330 L330 380 L420 300 L520 390 L600 350 L700 420 L820 360 L900 400 L1000 320 L1090 370 L1180 290 L1280 360 L1360 320 L1460 390 L1540 340 L1600 370 L1600 760 L0 760 Z" fill="url(#lejos)" opacity=".75"/>
