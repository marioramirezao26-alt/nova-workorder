    <circle cx="820" cy="90" r="1" opacity=".4"/><circle cx="1040" cy="50" r="1.3" opacity=".6"/><circle cx="1260" cy="110" r="1" opacity=".5"/>
    <circle cx="1480" cy="70" r="1.4" opacity=".6"/><circle cx="1380" cy="200" r="1" opacity=".35"/><circle cx="240" cy="230" r="1" opacity=".35"/>
